  heartRateMax: Int
  heartRateAverage: Int
  mood: Mood
  effort: Int
  wind: Wind
  source: Source!
  stravaActivityId: Long
  vehicle: Vehicle
  merge: ActivityMerge
  tags: [Tag!]!
  gadgets: [Gadget!]!
  uid: UUID!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

"A connection to a list of items."
type ActivityConnection {
  "A list of edges."
  edges: [ActivityEdge!]
  "A flattened list of the nodes"
  nodes: [Activity!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

type ActivityEdge {
  "The item at the end of the edge."
  node: Activity!
  "A cursor for use in pagination."
  cursor: String!
}

