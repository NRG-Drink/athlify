schema {
  query: Query
  mutation: Mutation
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @cost(weight: "10")
  activityMerges(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ActivityMergeFilterInput @cost(weight: "10")
    order: [ActivityMergeSortInput!] @cost(weight: "10")
  ): ActivityMergeConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  activities(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ActivityFilterInput @cost(weight: "10")
    order: [ActivitySortInput!] @cost(weight: "10")
  ): ActivityConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  bodyStatsById(id: ID!): BodyStats @cost(weight: "10")
  bodyStats(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: BodyStatsFilterInput @cost(weight: "10")
    order: [BodyStatsSortInput!] @cost(weight: "10")
  ): BodyStatsConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  events(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: EventFilterInput @cost(weight: "10")
    order: [EventSortInput!] @cost(weight: "10")
  ): EventConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  gadgets(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: GadgetFilterInput @cost(weight: "10")
    order: [GadgetSortInput!] @cost(weight: "10")
  ): GadgetConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tags(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: TagFilterInput @cost(weight: "10")
    order: [TagSortInput!] @cost(weight: "10")
  ): TagConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  me: User! @cost(weight: "10")
  vehicles(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: VehicleFilterInput @cost(weight: "10")
    order: [VehicleSortInput!] @cost(weight: "10")
  ): VehicleConnection!
    @listSize(
      assumedSize: 200
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  helloPerson(name: String! = "World"): String!
}

type Mutation {
  createActivityMerge(name: String, activityIds: [ID!]!): ActivityMerge!
    @cost(weight: "10")
  renameActivityMerge(id: ID!, name: String): ActivityMerge @cost(weight: "10")
  addActivityToMerge(mergeId: ID!, activityId: ID!): ActivityMerge
    @cost(weight: "10")
  removeActivityFromMerge(mergeId: ID!, activityId: ID!): ActivityMerge
    @cost(weight: "10")
  deleteActivityMerge(id: ID!): ID @cost(weight: "10")
  createActivity(activity: ActivityInput!): Activity! @cost(weight: "10")
  updateActivity(id: ID!, activity: ActivityInput!): Activity
    @cost(weight: "10")
  deleteActivity(id: ID!): ID @cost(weight: "10")
  addBodyStats(bodyStats: BodyStatsInput!): BodyStats! @cost(weight: "10")
  updateBodyStats(id: ID!, bodyStats: BodyStatsInput!): BodyStats
    @cost(weight: "10")
  deleteBodyStats(id: ID!): ID @cost(weight: "10")
  createEvent(event: EventInput!): Event! @cost(weight: "10")
  updateEvent(id: ID!, event: EventInput!): Event @cost(weight: "10")
  deleteEvent(id: ID!): ID @cost(weight: "10")
  createGadget(gadget: GadgetInput!): Gadget! @cost(weight: "10")
  updateGadget(id: ID!, gadget: GadgetInput!): Gadget @cost(weight: "10")
  deleteGadget(id: ID!): ID @cost(weight: "10")
  createTag(tag: TagInput!): Tag! @cost(weight: "10")
  updateTag(id: ID!, tag: TagInput!): Tag @cost(weight: "10")
  deleteTag(id: ID!): ID @cost(weight: "10")
  createMaintenanceCycle(maintenanceCycle: MaintenanceCycleInput!): MaintenanceCycle!
    @cost(weight: "10")
  updateMaintenanceCycle(id: ID!, maintenanceCycle: MaintenanceCycleInput!): MaintenanceCycle
    @cost(weight: "10")
  deleteMaintenanceCycle(id: ID!): ID @cost(weight: "10")
  createVehicle(vehicle: VehicleInput!): Vehicle! @cost(weight: "10")
  updateVehicle(id: ID!, vehicle: VehicleInput!): Vehicle @cost(weight: "10")
  deleteVehicle(id: ID!): ID @cost(weight: "10")
}

type Activity implements Node {
  id: ID!
