name: ci-cd.build-test

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'GitVersion.yml'
      - 'dotnet-tools.json'
      - '!**.md'
      - '!docs/**'
      - '!.agents/**'
      - '!.claude/**'
      - '!.devcontainer/**'

jobs:
  build-test-pack-publish-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Run Pipeline 
        run: dotnet run -c Release -- test-only
        working-directory: "src/backend/Athlify.Build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts-upload/
