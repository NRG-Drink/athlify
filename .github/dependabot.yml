version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directories:
      - "/src/backend/**"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/frontend/athlify"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
