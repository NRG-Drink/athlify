# Lefthook configuration for Athlify monorepo
# Manages git hooks across frontend and backend packages

fail: fast

pre-commit:
  commands:
    frontend-format:
      glob: "src/frontend/athlify/**/*.{ts,tsx,js,jsx,css}"
      run: cd src/frontend/athlify && npm run format
      stage_fixed: true

    frontend-lint:
      glob: "src/frontend/athlify/**/*.{ts,tsx,js,jsx}"
      run: cd src/frontend/athlify && npm run lint
      stage_fixed: true

    frontend-typecheck:
      glob: "src/frontend/athlify/**/*.{ts,tsx}"
      run: cd src/frontend/athlify && npm run typecheck
      stage_fixed: true
